<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>赛博养鱼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      line-height: 1.9;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
    #hud b { color: #b18cff; font-weight: 600; }
    #title {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(177,140,255,0.7);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 20px rgba(177,140,255,0.6);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>移动鼠标 → <b>鱼群跟随</b></div>
    <div>左键点击 → <b>鱼群散开</b></div>
    <div>右键 → <b>重新聚集</b></div>
  </div>
  <div id="title">赛博养鱼 · 鼠标逗鱼</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <script>
    // ============ 配置 ============
    const FISH_COUNT = 40;      // 鱼的数量
    const MAX_SPEED = 3.5;      // 最大游速
    const MAX_FORCE = 0.15;     // 转向力上限
    const PERCEPTION = 80;      // 感知半径（邻居距离）
    const SEPARATION = 40;      // 分离距离

    let fishes = [];
    let mouseTarget;
    let scareMode = false;      // 是否处于"惊吓散开"状态
    let scareTimer = 0;

    // ============ 初始化 ============
    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB, 360, 100, 100, 100);
      background(0);
      mouseTarget = createVector(width / 2, height / 2);
      for (let i = 0; i < FISH_COUNT; i++) {
        fishes.push(new Fish(random(width), random(height)));
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0);
    }

    // ============ 鼠标交互 ============
    function mouseMoved() {
      mouseTarget.set(mouseX, mouseY);
    }

    function mouseDragged() {
      mouseTarget.set(mouseX, mouseY);
      return false;
    }

    function mousePressed() {
      if (mouseButton === LEFT) {
        // 惊吓：给每条鱼一个远离鼠标的冲量
        scareMode = true;
        scareTimer = 30;
        for (let f of fishes) {
          const d = p5.Vector.sub(f.pos, createVector(mouseX, mouseY));
          d.setMag(8);
          f.vel.add(d);
        }
      } else if (mouseButton === RIGHT) {
        // 右键：回到跟随模式
        scareMode = false;
      }
      return false;
    }

    document.addEventListener('contextmenu', e => e.preventDefault());

    // ============ 鱼 ============
    class Fish {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(1, 3));
        this.acc = createVector(0, 0);
        // 每条鱼有自己的颜色相位，让鱼群颜色渐变不一
        this.hueOffset = random(-20, 20);
        // 尾巴摆动相位
        this.tailPhase = random(TWO_PI);
        this.tailSpeed = random(0.15, 0.25);
        // 鱼的大小
        this.size = random(12, 20);
      }

      // 三个基本行为力
      flock(others) {
        let sep = createVector(0, 0);
        let ali = createVector(0, 0);
        let coh = createVector(0, 0);
        let sepCount = 0, aliCount = 0, cohCount = 0;

        for (let other of others) {
          if (other === this) continue;
          const d = p5.Vector.dist(this.pos, other.pos);
          if (d > 0 && d < PERCEPTION) {
            // 分离
            if (d < SEPARATION) {
              const diff = p5.Vector.sub(this.pos, other.pos);
              diff.div(d);
              sep.add(diff);
              sepCount++;
            }
            // 对齐
            ali.add(other.vel);
            aliCount++;
            // 聚合
            coh.add(other.pos);
            cohCount++;
          }
        }

        if (sepCount > 0) {
          sep.div(sepCount);
          sep.setMag(MAX_SPEED);
          sep.sub(this.vel);
          sep.limit(MAX_FORCE * 2.5);
        }
        if (aliCount > 0) {
          ali.div(aliCount);
          ali.setMag(MAX_SPEED);
          ali.sub(this.vel);
          ali.limit(MAX_FORCE);
        }
        if (cohCount > 0) {
          coh.div(cohCount);
          coh.sub(this.pos);
          coh.setMag(MAX_SPEED);
          coh.sub(this.vel);
          coh.limit(MAX_FORCE);
        }

        this.acc.add(sep.mult(1.8));
        this.acc.add(ali.mult(1.0));
        this.acc.add(coh.mult(0.9));
      }

      // 追随鼠标
      followTarget() {
        if (scareMode) return;
        const desired = p5.Vector.sub(mouseTarget, this.pos);
        const d = desired.mag();
        if (d > 5) {
          desired.setMag(MAX_SPEED);
          const steer = p5.Vector.sub(desired, this.vel);
          steer.limit(MAX_FORCE * 1.2);
          this.acc.add(steer);
        }
      }

      update() {
        this.vel.add(this.acc);
        this.vel.limit(MAX_SPEED);
        this.pos.add(this.vel);
        this.acc.mult(0);

        // 尾巴摆动
        this.tailPhase += this.tailSpeed;

        // 边界处理：穿墙（从另一边出现）
        if (this.pos.x < -30) this.pos.x = width + 30;
        if (this.pos.x > width + 30) this.pos.x = -30;
        if (this.pos.y < -30) this.pos.y = height + 30;
        if (this.pos.y > height + 30) this.pos.y = -30;
      }

      display() {
        // 朝向由速度决定
        const angle = this.vel.heading();
        // 颜色：蓝紫粉渐变，随时间缓慢漂移
        const hue = (260 + this.hueOffset + frameCount * 0.3) % 360;

        push();
        translate(this.pos.x, this.pos.y);
        rotate(angle);

        // 鱼身（椭圆）+ 光晕
        noStroke();
        // 外层光晕
        fill(hue, 80, 100, 15);
        ellipse(0, 0, this.size * 2.2, this.size * 1.2);
        // 鱼身
        fill(hue, 70, 95, 55);
        ellipse(0, 0, this.size * 1.8, this.size);

        // 尾巴（三角形，摆动）
        const tailSwing = sin(this.tailPhase) * 0.5;
        push();
        translate(-this.size * 0.9, 0);
        rotate(tailSwing);
        fill(hue, 80, 100, 60);
        triangle(0, 0, -this.size * 0.8, -this.size * 0.5, -this.size * 0.8, this.size * 0.5);
        pop();

        // 眼睛（小白点）
        fill(0, 0, 100, 70);
        ellipse(this.size * 0.5, -this.size * 0.15, 2.5, 2.5);

        pop();
      }
    }

    // ============ 主循环 ============
    function draw() {
      // 半透明遮罩 → 拖尾效果
      noStroke();
      fill(0, 0, 0, 12);
      rect(0, 0, width, height);

      // 惊吓计时衰减
      if (scareMode) {
        scareTimer--;
        if (scareTimer <= 0) scareMode = false;
      }

      // 更新所有鱼
      for (let f of fishes) {
        f.flock(fishes);
        f.followTarget();
        f.update();
        f.display();
      }

      // 鼠标位置的光点（吸引源可视化）
      noFill();
      stroke(280, 80, 100, 30);
      strokeWeight(1.5);
      ellipse(mouseX, mouseY, 50 + sin(frameCount * 0.1) * 8);
      fill(280, 80, 100, 15);
      noStroke();
      ellipse(mouseX, mouseY, 20);
    }
  </script>
</body>
</html>
