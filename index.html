<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>赛博养鱼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden; cursor: crosshair;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed; top: 20px; left: 20px;
      color: rgba(255,255,255,0.6); font-size: 13px; line-height: 1.9;
      pointer-events: none; z-index: 10;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
    #hud b { color: #ffb088; font-weight: 600; }
    #title {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 14px; letter-spacing: 2px;
      pointer-events: none; z-index: 10;
    }
    #audio-hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.9); font-size: 16px; letter-spacing: 2px;
      background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 30px;
      pointer-events: none; z-index: 20; transition: opacity 1s;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>移动鼠标 → <b>鱼群跟随</b></div>
    <div>左键点击 → <b>鱼群散开</b></div>
    <div>右键 → <b>水波纹 + 散开</b></div>
  </div>
  <div id="title">赛博养鱼 · 鼠标逗鱼</div>
  <div id="audio-hint">点击任意位置开启治愈音效 🎵</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

  <script>
    const FISH_COUNT = 40;
    const MAX_SPEED = 3.5;
    const MAX_FORCE = 0.15;
    const PERCEPTION = 80;
    const SEPARATION = 40;

    // 你提供的色卡（作为中间色）
    const COLOR_STAGES = [
      [
        { r: 148, g: 91,  b: 144 }, // #945B90
        { r: 206, g: 139, b: 141 }, // #CE8B8D
        { r: 202, g: 240, b: 255 }  // #CAF0FF
      ],
      [
        { r: 94,  g: 50,  b: 99  }, // #5E3263
        { r: 106, g: 126, b: 187 }, // #6A7EBB
        { r: 253, g: 254, b: 204 }  // #FDFECC
      ],
      [
        { r: 39,  g: 34,  b: 120 }, // #272278
        { r: 105, g: 141, b: 204 }, // #698DCC
        { r: 255, g: 207, b: 228 }  // #FFCFE4
      ]
    ];

    const HOLD_DURATION = 4000;       
    const TRANSITION_DURATION = 3000; 

    let phaseStartTime = 0;
    let fishes = [];
    let ripples = [];
    let mouseTarget;
    let scareMode = false;
    let scareTimer = 0;

    // 音频
    let audioStarted = false;
    let padSynth, pluckSynth;
    let lastPluckTime = 0;
    const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(RGB, 255); 
      background(0, 0, 0);
      
      mouseTarget = createVector(width / 2, height / 2);
      for (let i = 0; i < FISH_COUNT; i++) {
        let colorType = i % 3; 
        fishes.push(new Fish(random(width), random(height), colorType));
      }
      phaseStartTime = millis();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0, 0, 0);
    }

    function initAudio() {
      if (audioStarted) return;
      audioStarted = true;
      const hint = document.getElementById('audio-hint');
      hint.style.opacity = 0;
      setTimeout(() => hint.remove(), 1000);

      Tone.start();
      padSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 4, decay: 2, sustain: 1, release: 5 }
      }).toDestination();
      padSynth.volume.value = -20; 

      const chords = [
        ["C3", "G3", "E4", "B4"], ["A2", "E3", "C4", "G4"],
        ["F2", "C3", "A3", "E4"], ["G2", "D3", "B3", "F4"]
      ];
      let chordIndex = 0;
      new Tone.Loop((time) => {
        padSynth.triggerAttackRelease(chords[chordIndex], "4m", time);
        chordIndex = (chordIndex + 1) % chords.length;
      }, "4m").start(0);

      pluckSynth = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 1.2 }
      }).toDestination();
      const reverb = new Tone.Reverb(5).toDestination();
      pluckSynth.connect(reverb);
      pluckSynth.volume.value = -14;
      Tone.Transport.start();
    }

    function mouseMoved() { 
      mouseTarget.set(mouseX, mouseY); 
      const now = millis();
      if (audioStarted && now - lastPluckTime > 350) { 
        const note = random(PENTATONIC);
        const vel = map(mouseY, 0, height, 0.1, 0.3);
        pluckSynth.triggerAttackRelease(note, "8n", Tone.now(), vel);
        lastPluckTime = now;
      }
    }
    function mouseDragged() { mouseTarget.set(mouseX, mouseY); return false; }

    function mousePressed() {
      initAudio();
      if (mouseButton === LEFT) {
        scareMode = true; scareTimer = 30;
        for (let f of fishes) {
          const d = p5.Vector.sub(f.pos, createVector(mouseX, mouseY));
          d.setMag(8); f.vel.add(d);
        }
      } else if (mouseButton === RIGHT) {
        scareMode = true; scareTimer = 40;
        for (let f of fishes) {
          const d = p5.Vector.sub(f.pos, createVector(mouseX, mouseY));
          d.setMag(10); f.vel.add(d);
        }
        ripples.push(new Ripple(mouseX, mouseY));
      }
      return false;
    }
    document.addEventListener('contextmenu', e => e.preventDefault());

    class Fish {
      constructor(x, y, colorType) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(1, 3));
        this.acc = createVector(0, 0);
        this.colorType = colorType; 
        
        const sizeRand = random();
        // 长度稍微加大一点，因为是细长条
        this.size = map(sizeRand * sizeRand, 0, 1, 10, 30);
        this.tailPhase = random(TWO_PI);
        this.tailSpeed = random(0.15, 0.28);
        this.wigglePhase = random(TWO_PI);
      }

      // 获取当前基础色
      getCurrentColor() {
        const now = millis() - phaseStartTime;
        const cycleTime = now % 21000; 
        
        let c1, c2, t;
        
        if (cycleTime < HOLD_DURATION) {
          c1 = COLOR_STAGES[0][this.colorType]; c2 = COLOR_STAGES[0][this.colorType]; t = 0;
        } else if (cycleTime < HOLD_DURATION + TRANSITION_DURATION) {
          c1 = COLOR_STAGES[0][this.colorType]; c2 = COLOR_STAGES[1][this.colorType];
          t = (cycleTime - HOLD_DURATION) / TRANSITION_DURATION;
        } else if (cycleTime < HOLD_DURATION * 2 + TRANSITION_DURATION) {
          c1 = COLOR_STAGES[1][this.colorType]; c2 = COLOR_STAGES[1][this.colorType]; t = 0;
        } else if (cycleTime < HOLD_DURATION * 2 + TRANSITION_DURATION * 2) {
          c1 = COLOR_STAGES[1][this.colorType]; c2 = COLOR_STAGES[2][this.colorType];
          t = (cycleTime - (HOLD_DURATION * 2 + TRANSITION_DURATION)) / TRANSITION_DURATION;
        } else if (cycleTime < HOLD_DURATION * 3 + TRANSITION_DURATION * 2) {
          c1 = COLOR_STAGES[2][this.colorType]; c2 = COLOR_STAGES[2][this.colorType]; t = 0;
        } else {
          c1 = COLOR_STAGES[2][this.colorType]; c2 = COLOR_STAGES[0][this.colorType];
          t = (cycleTime - (HOLD_DURATION * 3 + TRANSITION_DURATION * 2)) / TRANSITION_DURATION;
        }

        const col1 = color(c1.r, c1.g, c1.b);
        const col2 = color(c2.r, c2.g, c2.b);
        return lerpColor(col1, col2, t);
      }

      // ★ 派生颜色：根据比例调整明暗
      getTintColor(baseColor, factor) {
        let r = baseColor.levels[0];
        let g = baseColor.levels[1];
        let b = baseColor.levels[2];
        
        if (factor < 0) {
          // 变深 (头部)
          let f = 1 + factor; 
          return color(r * f, g * f, b * f);
        } else {
          // 变浅 (尾部)
          return color(
            r + (255 - r) * factor,
            g + (255 - g) * factor,
            b + (255 - b) * factor
          );
        }
      }

      flock(others) {
        let sep = createVector(0, 0), ali = createVector(0, 0), coh = createVector(0, 0);
        let sepCount = 0, aliCount = 0, cohCount = 0;
        for (let other of others) {
          if (other === this) continue;
          const d = p5.Vector.dist(this.pos, other.pos);
          if (d > 0 && d < PERCEPTION) {
            if (d < SEPARATION) {
              const diff = p5.Vector.sub(this.pos, other.pos); diff.div(d); sep.add(diff); sepCount++;
            }
            ali.add(other.vel); aliCount++;
            coh.add(other.pos); cohCount++;
          }
        }
        if (sepCount > 0) { sep.div(sepCount); sep.setMag(MAX_SPEED); sep.sub(this.vel); sep.limit(MAX_FORCE * 2.5); }
        if (aliCount > 0) { ali.div(aliCount); ali.setMag(MAX_SPEED); ali.sub(this.vel); ali.limit(MAX_FORCE); }
        if (cohCount > 0) { coh.div(cohCount); coh.sub(this.pos); coh.setMag(MAX_SPEED); coh.sub(this.vel); coh.limit(MAX_FORCE); }
        this.acc.add(sep.mult(1.8)); this.acc.add(ali.mult(1.0)); this.acc.add(coh.mult(0.9));
      }

      followTarget() {
        if (scareMode) return;
        const desired = p5.Vector.sub(mouseTarget, this.pos);
        if (desired.mag() > 5) {
          desired.setMag(MAX_SPEED);
          const steer = p5.Vector.sub(desired, this.vel);
          steer.limit(MAX_FORCE * 1.2);
          this.acc.add(steer);
        }
      }

      update() {
        this.vel.add(this.acc); this.vel.limit(MAX_SPEED); this.pos.add(this.vel); this.acc.mult(0);
        this.tailPhase += this.tailSpeed; this.wigglePhase += this.tailSpeed * 0.8;
        if (this.pos.x < -40) this.pos.x = width + 40;
        if (this.pos.x > width + 40) this.pos.x = -40;
        if (this.pos.y < -40) this.pos.y = height + 40;
        if (this.pos.y > height + 40) this.pos.y = -40;
      }

      display() {
        // 获取基础中间色
        const baseC = this.getCurrentColor();
        
        // 头深尾浅：头部系数 -0.4，中间 0，尾部 +0.4
        const cHead = this.getTintColor(baseC, -0.4);
        const cTail = this.getTintColor(baseC, 0.4);
        
        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.vel.heading());
        noStroke();
        
        // 1. 发光层（用半透明的中间色）
        fill(baseC.levels[0], baseC.levels[1], baseC.levels[2], 25);
        ellipse(0, 0, this.size * 4.5, this.size * 1.5);
        fill(baseC.levels[0], baseC.levels[1], baseC.levels[2], 50);
        ellipse(0, 0, this.size * 2.5, this.size * 0.8);
        
        // 2. 鱼身：细长条 + 渐变
        push();
        // 因为没有直接画渐变形状的函数，我们用连续的小四边形来拼出渐变！
        let steps = 15;
        for(let i=0; i<steps; i++) {
          let t1 = i / steps;
          let t2 = (i + 1) / steps;
          
          // x 从 1.3 到 -0.9
          let x1 = map(t1, 0, 1, this.size * 1.3, -this.size * 0.9);
          let x2 = map(t2, 0, 1, this.size * 1.3, -this.size * 0.9);
          
          // 高度用 sin 模拟细长纺锤形
          let y1 = sin(t1 * PI) * this.size * 0.25; 
          let y2 = sin(t2 * PI) * this.size * 0.25; 
          
          // 颜色插值
          let c1 = lerpColor(cHead, cTail, t1);
          let c2 = lerpColor(cHead, cTail, t2);
          
          // 上侧画一段
          fill(c1); quad(x1, 0, x1, -y1, x2, -y2, x2, 0);
          fill(c2); quad(x1, 0, x2, 0, x2, y2, x1, y1);
        }
        pop();
        
        // 3. 背鳍 (细长)
        push();
        translate(-this.size * 0.1, -this.size * 0.15); rotate(sin(this.wigglePhase) * 0.15);
        fill(cHead); // 用稍深的颜色
        beginShape(); 
        vertex(0, 0); 
        vertex(-this.size * 0.5, -this.size * 0.4); 
        vertex(-this.size * 0.2, -this.size * 0.05); 
        endShape(CLOSE);
        pop();
        
        // 4. 尾巴：深到浅
        push();
        translate(-this.size * 0.85, 0); rotate(sin(this.tailPhase) * 0.6);
        fill(cTail); // 尾巴用最浅的颜色
        beginShape(); 
        vertex(0, 0); 
        vertex(-this.size * 1.0, -this.size * 0.6); 
        vertex(-this.size * 0.6, 0); 
        vertex(-this.size * 1.0, this.size * 0.6); 
        endShape(CLOSE);
        pop();
        
        // 5. 腹鳍 (细长)
        push();
        translate(this.size * 0.2, this.size * 0.15); rotate(sin(this.wigglePhase) * 0.3);
        fill(cHead);
        triangle(0, 0, -this.size * 0.4, this.size * 0.35, this.size * 0.1, this.size * 0.1);
        pop();
        
        // 6. 眼睛（不需要高光了，直接小圆点）
        fill(255, 255, 255, 90); 
        ellipse(this.size * 0.8, -this.size * 0.05, 2.5, 2.5);
        pop();
      }
    }

    class Ripple {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.radius = 0; this.maxRadius = random(200, 280);
        this.life = 100; this.speed = 1.8;
      }
      update() { this.radius += this.speed; this.life -= 100 / (this.maxRadius / this.speed); }
      display() {
        const alpha = map(this.life, 0, 100, 0, 80); 
        noFill(); 
        stroke(255, 255, 255, alpha); strokeWeight(1.2); ellipse(this.pos.x, this.pos.y, this.radius * 2);
        stroke(255, 255, 255, alpha * 0.4); strokeWeight(0.8); ellipse(this.pos.x, this.pos.y, this.radius * 1.85);
      }
      isDead() { return this.life <= 0; }
    }

    function draw() {
      noStroke();
      fill(0, 0, 0, 25); 
      rect(0, 0, width, height);

      if (scareMode) { scareTimer--; if (scareTimer <= 0) scareMode = false; }

      for (let f of fishes) { f.flock(fishes); f.followTarget(); f.update(); f.display(); }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i]; r.update(); r.display();
        if (r.isDead()) ripples.splice(i, 1);
      }

      noFill(); stroke(255, 255, 255, 30); strokeWeight(1);
      ellipse(mouseX, mouseY, 60 + sin(frameCount * 0.05) * 10);
    }
  </script>
</body>
</html>
