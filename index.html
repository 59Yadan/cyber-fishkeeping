<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>赛博养鱼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b1224;
      overflow: hidden;
      cursor: crosshair;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      line-height: 1.9;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
    #hud b { color: #ffb088; font-weight: 600; }
    #title {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>移动鼠标 → <b>鱼群跟随</b></div>
    <div>左键点击 → <b>鱼群散开</b></div>
    <div>右键 → <b>水波纹 + 散开</b></div>
  </div>
  <div id="title">赛博养鱼 · 鼠标逗鱼</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <script>
    // ============ 配置 ============
    const FISH_COUNT = 40;
    const MAX_SPEED = 3.5;
    const MAX_FORCE = 0.15;
    const PERCEPTION = 80;
    const SEPARATION = 40;

    const COLOR_SCHEMES = [
      { name: '橙红', baseHue: 25,  hueRange: 20 },
      { name: '蓝色', baseHue: 210, hueRange: 25 },
      { name: '黄色', baseHue: 50,  hueRange: 18 },
      { name: '绿色', baseHue: 140, hueRange: 25 },
      { name: '紫色', baseHue: 280, hueRange: 25 },
      { name: '粉色', baseHue: 330, hueRange: 20 }
    ];

    // ★ 切换节奏
    const HOLD_DURATION = 3000;      // 每个色系保持 3 秒
    const TRANSITION_DURATION = 1500; // 过渡持续 1.5 秒

    let currentScheme = 0;
    let nextScheme = 1;
    let phaseStartTime = 0;
    let transitionProgress = 0; // 0=完全用current, 1=完全用next

    let fishes = [];
    let ripples = [];
    let mouseTarget;
    let scareMode = false;
    let scareTimer = 0;

    // ============ 初始化 ============
    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB, 360, 100, 100, 100);
      background(220, 60, 12);
      mouseTarget = createVector(width / 2, height / 2);
      for (let i = 0; i < FISH_COUNT; i++) {
        fishes.push(new Fish(random(width), random(height)));
      }
      phaseStartTime = millis();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(220, 60, 12);
    }

    // ★ 色相插值：走最短路径
    function lerpHue(a, b, t) {
      let diff = ((b - a + 540) % 360) - 180; // 范围 -180 ~ 180
      return (a + diff * t + 360) % 360;
    }

    // ============ 鼠标交互 ============
    function mouseMoved() { mouseTarget.set(mouseX, mouseY); }
    function mouseDragged() { mouseTarget.set(mouseX, mouseY); return false; }

    function mousePressed() {
      if (mouseButton === LEFT) {
        scareMode = true;
        scareTimer = 30;
        for (let f of fishes) {
          const d = p5.Vector.sub(f.pos, createVector(mouseX, mouseY));
          d.setMag(8);
          f.vel.add(d);
        }
      } else if (mouseButton === RIGHT) {
        scareMode = true;
        scareTimer = 40;
        for (let f of fishes) {
          const d = p5.Vector.sub(f.pos, createVector(mouseX, mouseY));
          d.setMag(10);
          f.vel.add(d);
        }
        ripples.push(new Ripple(mouseX, mouseY));
      }
      return false;
    }

    document.addEventListener('contextmenu', e => e.preventDefault());

    // ============ 鱼 ============
    class Fish {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(1, 3));
        this.acc = createVector(0, 0);

        this.hueOffset = random(-1, 1);

        const sizeRand = random();
        this.size = map(sizeRand * sizeRand, 0, 1, 7, 26);

        this.tailPhase = random(TWO_PI);
        this.tailSpeed = random(0.15, 0.28);
        this.wigglePhase = random(TWO_PI);
      }

      // ★ 色相基于过渡进度插值
      getHue() {
        const from = COLOR_SCHEMES[currentScheme];
        const to = COLOR_SCHEMES[nextScheme];

        // 各自算出本鱼在两个色系下的色相
        const hFrom = from.baseHue + this.hueOffset * from.hueRange;
        const hTo = to.baseHue + this.hueOffset * to.hueRange;

        // 用最短路径插值
        let h = lerpHue(hFrom, hTo, transitionProgress);

        // 呼吸微调
        const breath = sin(frameCount * 0.01 + this.hueOffset * 10) * 5;
        return (h + breath + 360) % 360;
      }

      flock(others) {
        let sep = createVector(0, 0);
        let ali = createVector(0, 0);
        let coh = createVector(0, 0);
        let sepCount = 0, aliCount = 0, cohCount = 0;

        for (let other of others) {
          if (other === this) continue;
          const d = p5.Vector.dist(this.pos, other.pos);
          if (d > 0 && d < PERCEPTION) {
            if (d < SEPARATION) {
              const diff = p5.Vector.sub(this.pos, other.pos);
              diff.div(d);
              sep.add(diff);
              sepCount++;
            }
            ali.add(other.vel);
            aliCount++;
            coh.add(other.pos);
            cohCount++;
          }
        }

        if (sepCount > 0) {
          sep.div(sepCount);
          sep.setMag(MAX_SPEED);
          sep.sub(this.vel);
          sep.limit(MAX_FORCE * 2.5);
        }
        if (aliCount > 0) {
          ali.div(aliCount);
          ali.setMag(MAX_SPEED);
          ali.sub(this.vel);
          ali.limit(MAX_FORCE);
        }
        if (cohCount > 0) {
          coh.div(cohCount);
          coh.sub(this.pos);
          coh.setMag(MAX_SPEED);
          coh.sub(this.vel);
          coh.limit(MAX_FORCE);
        }

        this.acc.add(sep.mult(1.8));
        this.acc.add(ali.mult(1.0));
        this.acc.add(coh.mult(0.9));
      }

      followTarget() {
        if (scareMode) return;
        const desired = p5.Vector.sub(mouseTarget, this.pos);
        const d = desired.mag();
        if (d > 5) {
          desired.setMag(MAX_SPEED);
          const steer = p5.Vector.sub(desired, this.vel);
          steer.limit(MAX_FORCE * 1.2);
          this.acc.add(steer);
        }
      }

      update() {
        this.vel.add(this.acc);
        this.vel.limit(MAX_SPEED);
        this.pos.add(this.vel);
        this.acc.mult(0);

        this.tailPhase += this.tailSpeed;
        this.wigglePhase += this.tailSpeed * 0.8;

        if (this.pos.x < -40) this.pos.x = width + 40;
        if (this.pos.x > width + 40) this.pos.x = -40;
        if (this.pos.y < -40) this.pos.y = height + 40;
        if (this.pos.y > height + 40) this.pos.y = -40;
      }

      display() {
        const angle = this.vel.heading();
        const hue = this.getHue();
        const sat = 60;

        push();
        translate(this.pos.x, this.pos.y);
        rotate(angle);

        noStroke();
        for (let i = 2; i >= 1; i--) {
          fill(hue, sat, 100, 4);
          ellipse(0, 0, this.size * (1.8 + i * 1.0), this.size * (0.9 + i * 0.5));
        }

        push();
        fill(hue, sat, 95, 80);
        beginShape();
        vertex(this.size * 1.1, 0);
        bezierVertex(this.size * 0.6, -this.size * 0.55,
                     -this.size * 0.2, -this.size * 0.65,
                     -this.size * 0.7, -this.size * 0.25);
        vertex(-this.size * 0.9, 0);
        bezierVertex(-this.size * 0.7, this.size * 0.25,
                     -this.size * 0.2, this.size * 0.65,
                     this.size * 0.6, this.size * 0.55);
        endShape(CLOSE);
        pop();

        fill(hue, 25, 100, 35);
        ellipse(this.size * 0.1, -this.size * 0.15, this.size * 0.9, this.size * 0.35);

        const tailSwing = sin(this.tailPhase) * 0.6;
        push();
        translate(-this.size * 0.9, 0);
        rotate(tailSwing);
        fill(hue, sat, 95, 70);
        beginShape();
        vertex(0, 0);
        vertex(-this.size * 1.1, -this.size * 0.75);
        vertex(-this.size * 0.7, 0);
        vertex(-this.size * 1.1, this.size * 0.75);
        endShape(CLOSE);
        pop();

        const wiggle = sin(this.wigglePhase) * 0.3;
        push();
        translate(this.size * 0.1, this.size * 0.3);
        rotate(wiggle);
        fill(hue, sat, 95, 55);
        triangle(0, 0, -this.size * 0.3, this.size * 0.5, this.size * 0.15, this.size * 0.2);
        pop();

        fill(0, 0, 100, 80);
        ellipse(this.size * 0.6, -this.size * 0.1, 2, 2);

        pop();
      }
    }

    // ============ 水波纹 ============
    class Ripple {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.radius = 0;
        this.maxRadius = random(200, 280);
        this.life = 100;
        this.speed = 1.8;
      }
      update() {
        this.radius += this.speed;
        this.life -= 100 / (this.maxRadius / this.speed);
      }
      display() {
        const alpha = map(this.life, 0, 100, 0, 70);
        noFill();
        stroke(0, 0, 100, alpha);
        strokeWeight(1.5);
        ellipse(this.pos.x, this.pos.y, this.radius * 2);
      }
      isDead() { return this.life <= 0; }
    }

    // ============ 主循环 ============
    function draw() {
      noStroke();
      fill(220, 60, 12, 15);
      rect(0, 0, width, height);

      // ★ 色系过渡状态机
      const now = millis();
      const elapsed = now - phaseStartTime;

      if (elapsed < TRANSITION_DURATION) {
        // 过渡阶段：0 → 1
        transitionProgress = elapsed / TRANSITION_DURATION;
      } else if (elapsed < TRANSITION_DURATION + HOLD_DURATION) {
        // 保持阶段：完全用 next 色系
        transitionProgress = 1;
      } else {
        // 进入下一个周期：当前色系变成 next，next 再往后推
        currentScheme = nextScheme;
        nextScheme = (nextScheme + 1) % COLOR_SCHEMES.length;
        phaseStartTime = now;
        transitionProgress = 0;
      }

      if (scareMode) {
        scareTimer--;
        if (scareTimer <= 0) scareMode = false;
      }

      for (let f of fishes) {
        f.flock(fishes);
        f.followTarget();
        f.update();
        f.display();
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.update();
        r.display();
        if (r.isDead()) ripples.splice(i, 1);
      }

      noFill();
      stroke(25, 60, 100, 30);
      strokeWeight(1.5);
      ellipse(mouseX, mouseY, 50 + sin(frameCount * 0.1) * 8);
    }
  </script>
</body>
</html>
